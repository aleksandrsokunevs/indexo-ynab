<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indexo PDF uz YNAB CSV</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col p-4 md:p-8">
    <div class="max-w-3xl mx-auto flex-grow w-full">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Indexo PDF uz YNAB CSV</h1>
            <p class="text-gray-600">Konvertējiet savu bankas izrakstu formātā, ko saprot YNAB budžeta plānotājs.</p>
        </header>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 mb-6">
            <div id="drop-zone" class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center hover:border-blue-500 transition-colors cursor-pointer group">
                <input type="file" id="file-input" accept="application/pdf" class="hidden">
                <div class="flex flex-col items-center">
                    <svg class="w-12 h-12 text-gray-400 mb-4 group-hover:text-blue-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    <p class="text-lg font-medium text-gray-700">Izvēlieties vai ievelciet PDF failu šeit</p>
                    <p class="text-sm text-gray-500 mt-1">Apstrāde notiek tikai jūsu pārlūkprogrammā</p>
                </div>
            </div>

            <div id="status" class="hidden mt-6 p-4 rounded-lg text-sm"></div>

            <div id="actions" class="hidden mt-6 flex flex-col sm:flex-row gap-3">
                <button id="download-btn" class="flex-1 bg-blue-600 text-white font-semibold py-3 px-6 rounded-xl hover:bg-blue-700 transition-colors shadow-sm flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    Lejupielādēt CSV priekš YNAB
                </button>
                <button id="reset-btn" class="bg-gray-100 text-gray-600 font-semibold py-3 px-6 rounded-xl hover:bg-gray-200 transition-colors">
                    Sākt no jauna
                </button>
            </div>
        </div>

        <div id="preview-container" class="hidden bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden mb-8">
            <div class="p-4 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
                <h2 class="font-semibold text-gray-700">Darījumu priekšskatījums (pirmie 10)</h2>
                <span id="total-count" class="text-xs font-medium bg-blue-100 text-blue-700 py-1 px-2 rounded-full"></span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-100 text-gray-600">
                            <th class="p-4 font-semibold">Datums</th>
                            <th class="p-4 font-semibold">Saņēmējs / Apraksts</th>
                            <th class="p-4 font-semibold text-right">Summa</th>
                        </tr>
                    </thead>
                    <tbody id="preview-body" class="divide-y divide-gray-50"></tbody>
                </table>
            </div>
        </div>
    </div>

    <footer class="max-w-3xl mx-auto w-full py-8 border-t border-gray-200 mt-8 flex flex-col sm:flex-row justify-between items-center text-sm text-gray-500 gap-4">
        <div>&copy; 2025 Indexo-to-YNAB</div>
        <div class="flex items-center gap-4">
            <a href="https://github.com/YOUR_USERNAME/YOUR_REPO" id="github-link" target="_blank" class="flex items-center gap-2 hover:text-gray-900 transition-colors">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
                Skatīt GitHub
            </a>
        </div>
    </footer>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');
        const status = document.getElementById('status');
        const actions = document.getElementById('actions');
        const downloadBtn = document.getElementById('download-btn');
        const resetBtn = document.getElementById('reset-btn');
        const previewContainer = document.getElementById('preview-container');
        const previewBody = document.getElementById('preview-body');
        const totalCount = document.getElementById('total-count');

        let transactions = [];

        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => handleFile(e.target.files[0]);
        resetBtn.onclick = () => location.reload();

        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('border-blue-500', 'bg-blue-50'); };
        dropZone.ondragleave = () => dropZone.classList.remove('border-blue-500', 'bg-blue-50');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-blue-500', 'bg-blue-50');
            handleFile(e.dataTransfer.files[0]);
        };

        async function handleFile(file) {
            if (!file || file.type !== 'application/pdf') {
                showStatus('Lūdzu, izvēlieties derīgu PDF failu!', 'error');
                return;
            }

            showStatus('Apstrādā failu...', 'info');
            transactions = [];

            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                
                let fullText = "";
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    const pageText = textContent.items.map(item => item.str).join(" ");
                    fullText += pageText + "\n";
                }

                parseTransactions(fullText);
            } catch (err) {
                console.error(err);
                showStatus('Kļūda lasot PDF. Pārliecinieties, ka tas nav aizsargāts ar paroli.', 'error');
            }
        }

        function parseTransactions(text) {
            const rows = text.match(/(\d{4}-\d{2}-\d{2})\s+(\d+)\s+([\s\S]+?)(-?\d+\.\d{2})\s*€/g);

            if (!rows) {
                showStatus('Neizdevās atrast darījumus. Pārliecinieties, ka šis ir Indexo bankas izraksts.', 'error');
                return;
            }

            rows.forEach(row => {
                const dateMatch = row.match(/(\d{4}-\d{2}-\d{2})/);
                const amountMatch = row.match(/(-?\d+\.\d{2})\s*€/);
                
                if (dateMatch && amountMatch) {
                    const date = dateMatch[1];
                    let rawAmount = amountMatch[1];
                    
                    let memo = row.replace(date, '').replace(amountMatch[0], '').trim();
                    memo = memo.replace(/^\d+\s+/, ''); 
                    
                    const memoParts = memo.split(/,|\n/);
                    const payee = memoParts[0].trim();

                    transactions.push({
                        date: date,
                        payee: payee,
                        memo: memo.replace(/\s+/g, ' ').substring(0, 100),
                        amount: rawAmount
                    });
                }
            });

            if (transactions.length > 0) {
                showStatus(`Sekmīgi nolasīti ${transactions.length} darījumi!`, 'success');
                totalCount.textContent = `${transactions.length} darījumi`;
                displayPreview();
                actions.classList.remove('hidden');
            } else {
                showStatus('Darījumi netika atrasti.', 'error');
            }
        }

        function displayPreview() {
            previewBody.innerHTML = '';
            transactions.slice(0, 10).forEach(t => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="p-4 text-gray-500 font-mono text-xs">${t.date}</td>
                    <td class="p-4">
                        <div class="font-medium text-gray-900">${t.payee}</div>
                        <div class="text-xs text-gray-400 truncate max-w-xs">${t.memo}</div>
                    </td>
                    <td class="p-4 text-right font-semibold ${parseFloat(t.amount) < 0 ? 'text-red-600' : 'text-green-600'}">
                        ${t.amount} €
                    </td>
                `;
                previewBody.appendChild(row);
            });
            previewContainer.classList.remove('hidden');
        }

        downloadBtn.onclick = () => {
            let csvContent = "Date,Payee,Memo,Amount\n";
            transactions.forEach(t => {
                const row = `"${t.date}","${t.payee.replace(/"/g, '""')}","${t.memo.replace(/"/g, '""')}","${t.amount}"`;
                csvContent += row + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `indexo_ynab_${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        function showStatus(msg, type) {
            status.textContent = msg;
            status.className = 'mt-6 p-4 rounded-xl text-sm font-medium ';
            if (type === 'error') status.className += 'bg-red-50 text-red-700 border border-red-100';
            else if (type === 'success') status.className += 'bg-green-50 text-green-700 border border-green-100';
            else status.className += 'bg-blue-50 text-blue-700 border border-blue-100';
            status.classList.remove('hidden');
        }
    </script>
</body>
</html>
